# push のたびに Cloudflare Workers へデプロイする。
# 必要なもの（GitHub の Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN  テンプレート「Edit Cloudflare Workers」で作ったトークン
#   ELEVENLABS_API_KEY    あれば Worker のシークレットに入れる（文字起こしと読み上げ）
#   ANTHROPIC_API_KEY     あれば Worker のシークレットに入れる（相手役・赤ペン・カンペ）
# キーの値はリポジトリに入れない。
name: deploy
on:
  push:
    branches: [main, claude/spec-plan]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          for name in ANTHROPIC_API_KEY ELEVENLABS_API_KEY; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | pnpm exec wrangler secret put "$name"
            else
              echo "$name: GitHub の secret が無いので入れない"
            fi
          done
